<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DMA Beauty Quiz</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="home" class="screen">

    <h1>DMA BEAUTY QUIZ</h1>

    <p>Digital Marketing Analytics</p>

    <h3 id="totalQuestion"></h3>

    <button id="startBtn">
        START QUIZ
    </button>

</div>





<div id="quiz" class="screen hide">

    <div class="top">

        <div id="progressText">

            Question

        </div>

        <div id="beautyText">

            Beauty 50

        </div>

    </div>


    <div class="progress">

        <div id="progressBar"></div>

    </div>



    <div id="questionBox">

        Question Here

    </div>


    <div id="answers">

    </div>



    <button id="submitBtn">

        Submit

    </button>

    <button id="nextBtn" class="hide">

        Next

    </button>

</div>







<div id="result" class="screen hide">

    <h1>Finished</h1>

    <h2 id="finalBeauty"></h2>

    <h3 id="beautyRank"></h3>

    <p id="correctCount"></p>

    <p id="wrongCount"></p>

    <button id="playAgain">

        Play Again

    </button>

    <button id="goHome">

        Home

    </button>

</div>



<script src="questions.js"></script>

<script src="script.js"></script>

</body>

</html>
