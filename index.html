<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMA Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<!-- ================= HOME ================= -->

<section id="home" class="screen active">

    <div class="card home-card">

        <h1>DMA QUIZ</h1>

        <h2>Digital Marketing Analytics</h2>

        <p class="desc">
            🎲 Random câu hỏi<br>
            🎯 Random đáp án<br>
            💙 Tính điểm xinh đẹp
        </p>

        <button id="startBtn">
            BẮT ĐẦU
        </button>

    </div>

</section>

<!-- ================= QUIZ ================= -->

<section id="quiz" class="screen">

<div class="quiz-box">

<div class="top">

<div class="progress-text">

<span id="currentQuestion">1</span>

/

<span id="totalQuestion">0</span>

</div>

<div class="beauty-box">

💙

<span id="beautyScore">
50
</span>

</div>

</div>

<div class="progress">

<div id="progressBar"></div>

</div>

<div class="question-box">

<h2 id="question">

Question

</h2>

</div>

<div id="answers" class="answers">

</div>

<div class="bottom">

<button id="nextBtn" disabled>

NEXT →

</button>

</div>

</div>

</section>

<!-- ================= RESULT ================= -->

<section id="result" class="screen">

<div class="result-card">

<h1>

🎉 Hoàn thành

</h1>

<div class="result-score">

<div class="circle">

<span id="finalBeauty">

50

</span>

</div>

</div>

<h2 id="beautyText">

Bạn đẹp vừa đủ 😊

</h2>

<div class="stats">

<p>

✅ Đúng:

<span id="correctCount">

0

</span>

</p>

<p>

❌ Sai:

<span id="wrongCount">

0

</span>

</p>

<p>

📊 Chính xác:

<span id="accuracy">

0%

</span>

</p>

<p>

🏆 Rank:

<span id="rank">

A

</span>

</p>

</div>

<div class="buttons">

<button id="playAgain">

🔄 Chơi lại

</button>

<button id="backHome">

🏠 Trang chủ

</button>

</div>

</div>

</section>

<script src="questions.js"></script>

<script src="script.js"></script>

</body>

</html>
