            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 90, 179, 0.15);
            box-sizing: border-box;
        }

        h1 {
            color: var(--dark-blue);
            text-align: center;
            margin-top: 0;
            border-bottom: 3px solid var(--accent-blue);
            padding-bottom: 10px;
        }

        .status-board {
            display: flex;
            justify-content: space-between;
            background: var(--light-blue);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1em;
            border: 1px solid #b3d7ff;
        }

        .beauty-status {
            color: var(--primary-blue);
        }

        .beauty-rating {
            padding: 2px 8px;
            border-radius: 4px;
            color: white;
        }

        .rating-dep { background-color: var(--correct-green); }
        .rating-xau { background-color: var(--incorrect-red); }

        .question-box {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--dark-blue);
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: white;
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            padding: 15px;
            font-size: 1em;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
            font-weight: 500;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #f0f7ff;
            transform: translateX(5px);
        }

        .option-btn.correct {
            background-color: var(--correct-green) !important;
            border-color: var(--correct-green) !important;
            color: white !important;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-red) !important;
            border-color: var(--incorrect-red) !important;
            color: white !important;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--dark-blue);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            color: var(--primary-blue);
            font-size: 2em;
        }

        .final-beauty {
            font-size: 2.5em;
            margin: 20px 0;
            font-weight: bold;
        }

                    "To connect users to social media platforms.",
                    "To encrypt sensitive user information."
                ],
                answer: 1
            },
            {
                q: "What is the purpose of using contrast in data visualization?",
                options: [
                    "To make the entire dataset equally prominent",
                    "To separate important data from less important background data",
                    "To emphasize the use of refined execution techniques",
                    "To add random colors to the visualization"
                ],
                answer: 1
            },
            {
                q: "What is highlighted as a significant challenge related to location data?",
                options: ["Data encryption challenges", "Regulation issues", "Consumer awareness", "Facial recognition technology"],
                answer: 1
            }
        ];

        let currentQuestionIndex = 0;
        let beautyScore = 50;

        const questionTextEl = document.getElementById('question-text');
        const optionsBoxEl = document.getElementById('options-box');
        const currentQEl = document.getElementById('current-q');
        const totalQEl = document.getElementById('total-q');
        const beautyScoreEl = document.getElementById('beauty-score');
        const beautyLabelEl = document.getElementById('beauty-label');
        const nextButtonEl = document.getElementById('next-button');
        const gameScreenEl = document.getElementById('game-screen');
        const resultScreenEl = document.getElementById('result-screen');

        function initGame() {
            totalQEl.textContent = quizData.length;
            showQuestion();
        }

        function updateBeautyUI() {
            beautyScoreEl.textContent = beautyScore;
            if (beautyScore >= 50) {
                beautyLabelEl.textContent = "Đẹp";
                beautyLabelEl.className = "beauty-rating rating-dep";
            } else {
                beautyLabelEl.textContent = "Xấu";
                beautyLabelEl.className = "beauty-rating rating-xau";
            }
        }

        function showQuestion() {
            nextButtonEl.style.display = 'none';
            optionsBoxEl.innerHTML = '';
            
            currentQEl.textContent = currentQuestionIndex + 1;
            let currentQuestion = quizData[currentQuestionIndex];
            questionTextEl.textContent = currentQuestion.q;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.onclick = () => checkAnswer(index, button);
                optionsBoxEl.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex, selectedButton) {
            let currentQuestion = quizData[currentQuestionIndex];
            let buttons = optionsBoxEl.querySelectorAll('.option-btn');
            
            // Disable all buttons after choice
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQuestion.answer) {
                selectedButton.classList.add('correct');
                beautyScore += 5; // Trả lời đúng cộng điểm xinh đẹp
            } else {
                selectedButton.classList.add('incorrect');
                buttons[currentQuestion.answer].classList.add('correct');
                beautyScore -= 5; // Trả lời sai bị xấu đi
            }

            updateBeautyUI();
            nextButtonEl.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                showQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            gameScreenEl.style.display = 'none';
            resultScreenEl.style.display = 'block';
            document.getElementById('final-beauty-text').textContent = beautyScore;
            
            let evalText = "";
            if (beautyScore >= 80) {
                evalText = "Xuất sắc! Bạn vừa thông thái vừa sở hữu nhan sắc nghiêng nước nghiêng thành! ✨";
            } else if (beautyScore >= 50) {
                evalText = "Chúc mừng! Bạn đạt chuẩn ĐẸP và có kiến thức nền tảng rất vững chắc. 💙";
            } else {
                evalText = "Ối! Nhan sắc hơi bị 'lu mờ' một tí rồi. Hãy chơi lại để tút tát lại vẻ đẹp và kiến thức nhé! 🔥";
            }
            document.getElementById('final-eval').textContent = evalText;
        }

        function resetGame() {
            currentQuestionIndex = 0;
            beautyScore = 50;
            updateBeautyUI();
            resultScreenEl.style.display = 'none';
            gameScreenEl.style.display = 'block';
            showQuestion();
        }

        // Khởi chạy game
        initGame();
    </script>
</body>
</html>
